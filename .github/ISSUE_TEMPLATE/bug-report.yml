name: Bug report
description: Report a reproducible defect in OpenCode2 zh-CN
title: "[BUG]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, cookies, private prompts, customer data, session databases, or unredacted logs and paths.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the expected behavior and what happened instead.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Source commit
      description: Provide the exact commit used to run or build the program.
      placeholder: 40-character Git commit
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider route and model
      description: Include whether an official endpoint or third-party gateway is involved. Do not include credentials.
      placeholder: native OpenAI Responses / provider/model / third-party gateway yes or no
    validations:
      required: false

  - type: input
    id: plugins
    attributes:
      label: Plugins and MCP servers
      description: List relevant plugins and MCP server types without credentials or private endpoints.
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add a screenshot or minimal log excerpt only after removing private data.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 26, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Windows Terminal, iTerm2, Ghostty, Alacritty
    validations:
      required: false
